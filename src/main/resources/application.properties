spring.application.name=demo

# Activate dev profile by default (uses in-memory H2)
spring.profiles.active=dev

# Common JPA settings (apply to all profiles)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# TEMP: allow circular references for legacy setter-wired services
spring.main.allow-circular-references=true

# Reduce noise
logging.level.org.springframework.jdbc.core=INFO
logging.level.com.zaxxer.hikari=INFO

# To completely disable DB (not recommended if code expects it) you could add:
# spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
